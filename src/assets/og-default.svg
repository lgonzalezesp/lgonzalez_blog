	<rect width="1200" height="627" fill="#18181b"/>
	<rect x="0" y="0" width="16" height="627" fill="#93c5fd"/>
	<text x="96" y="300" fill="#f4f4f5" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700">Luis González</text>
	<text x="100" y="390" fill="#93c5fd" font-family="Helvetica, Arial, sans-serif" font-size="48">lgonzalez.dev</text>
	<rect x="100" y="450" width="120" height="6" fill="#3f3f46"/>
</svg>
